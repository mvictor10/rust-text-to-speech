[package]
name = "rust_voice_studio"
version = "1.0.2"
edition = "2021"
description = "Aplicativo desktop Text-to-Speech offline para Windows usando as vozes SAPI instaladas."
authors = ["Rust Voice Studio contributors"]
license = "MIT"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6.0"
rfd = "0.15.3"

[target.'cfg(windows)'.dependencies]
sapi-lite = "0.1.1"
hound = "3.5.1"
rusty_mp3 = "=1.0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
